name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish releases

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # The signing key is only handed to builds of main: a push to any other
      # branch builds with the debug key and never sees the real one.
      KEYSTORE_BASE64: ${{ github.ref == 'refs/heads/main' && secrets.KEYSTORE_BASE64 || '' }}
    steps:
      # Actions are pinned to exact commits (tag in the comment), so a moved
      # or hijacked tag can't change what runs with your signing key.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1

      # Checks gradle-wrapper.jar against Gradle's published checksums.
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c   # v6.4.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880   # v6.3.0
        with:
          distribution: temurin
          java-version: '17'

      # Your own signing key, so each new APK installs as an update.
      # Add repository secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD.
      - name: Load signing key
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/h9.jks"
          echo "H9_KEYSTORE=$RUNNER_TEMP/h9.jks" >> "$GITHUB_ENV"

      - name: Test and build
        env:
          H9_KEYSTORE_PASSWORD: ${{ github.ref == 'refs/heads/main' && secrets.KEYSTORE_PASSWORD || '' }}
          H9_KEY_ALIAS: ${{ github.ref == 'refs/heads/main' && secrets.KEY_ALIAS || '' }}
          H9_KEY_PASSWORD: ${{ github.ref == 'refs/heads/main' && secrets.KEY_PASSWORD || '' }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: H9-OPS-apk
          path: app/build/outputs/apk/release/*.apk

      # Publish a GitHub release when versionName changes, so Obtainium
      # (or anything else watching releases) picks up the new version.
      # Only done with your own signing key: updates signed with a different
      # key would not install over the old app.
      - name: Publish release for a new version
        if: env.KEYSTORE_BASE64 != '' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP "versionName\s+'\K[^']+" app/build.gradle)
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to publish."
            exit 0
          fi
          APK="H9-OPS-$VERSION.apk"
          cp app/build/outputs/apk/release/*.apk "$APK"
          # Notes: this version's section of CHANGELOG.md, then the firmware reminder.
          awk -v v="## $VERSION" '$0 ~ "^## " { p = (index($0, v) == 1) ; next } p' CHANGELOG.md > notes.md
          {
            echo
            echo "**Needs H9 OPS firmware P2 on the radio.** Stock TD-H9 firmware has no"
            echo "Bluetooth KISS service, so the app can't connect to it. See the README."
            echo
            echo "Built from ${GITHUB_SHA::7}."
          } >> notes.md
          gh release create "$TAG" "$APK" --title "H9 OPS $VERSION" --notes-file notes.md
